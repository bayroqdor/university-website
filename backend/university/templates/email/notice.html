{% extends "base.html" %}
{% block card %}
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"><tr><td class="pad" style="padding:40px 44px 40px;">
  <h1 class="h1" style="margin:0 0 14px;font:600 25px/32px {{ sans }};color:#121418;">{{ title }}</h1>
  <p style="margin:0;font:400 16px/26px {{ sans }};color:#565c69;white-space:pre-line;">{{ text }}</p>
  {% with href=href or (url ~ '/admin'), label=button or site_name %}{% include "_button.html" %}{% endwith %}
</td></tr></table>
{% endblock %}
