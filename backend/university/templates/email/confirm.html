{% extends "base.html" %}
{% block card %}
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"><tr><td class="pad" style="padding:40px 44px 40px;">
  <div style="font:600 12px/16px {{ sans }};letter-spacing:2px;text-transform:uppercase;color:{{ accent }};">{{ L.newsletter }}</div>
  <h1 class="h1" style="margin:12px 0 14px;font:600 27px/34px {{ sans }};color:#121418;">{{ L.confirm_title }}</h1>
  <p style="margin:0;font:400 16px/26px {{ sans }};color:#565c69;">{{ L.confirm_text }}</p>
  {% with href=link, label=L.confirm_button %}{% include "_button.html" %}{% endwith %}
  <p style="margin:22px 0 0;font:400 13px/20px {{ sans }};color:{{ accent }};">{{ L.confirm_ignore }}</p>
  <p style="margin:10px 0 0;font:400 12px/18px {{ sans }};color:#8a909c;word-break:break-all;">{{ link }}</p>
</td></tr></table>
{% endblock %}
