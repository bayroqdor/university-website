{% extends "base.html" %}
{% block card %}
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"><tr><td class="pad" style="padding:40px 44px 40px;">
  <div style="width:40px;height:3px;background:#b08d3c;font-size:0;line-height:0;">&nbsp;</div>
  <h1 class="h1" style="margin:14px 0 14px;font:600 27px/34px {{ sans }};color:#121418;">{{ L.welcome_title }}</h1>
  <p style="margin:0;font:400 16px/26px {{ sans }};color:#565c69;">{{ L.welcome_text }}</p>
  {% with href=url, label=L.visit %}{% include "_button.html" %}{% endwith %}
</td></tr></table>
{% endblock %}
{% block footer %}<a href="{{ unsub }}" style="color:#f6f4ef;font-weight:600;">{{ L.unsubscribe }}</a>{% endblock %}
